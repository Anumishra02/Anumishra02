<linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6EC7"/><stop offset="0.55" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="ecg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset="0.5" stop-color="#22D3EE"/><stop offset="1" stop-color="#FF6EC7"/></linearGradient>
<style>
.edge{stroke:#7C3AED;stroke-width:1;stroke-opacity:.55;stroke-dasharray:4 6;animation:flow 2.4s linear infinite}
.node{fill:#22D3EE;animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.title{font:800 58px 'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#title);animation:fade 1.6s ease-out both}
.sub{font:600 19px 'Courier New',monospace;fill:#c9d1d9;animation:fade 2.2s ease-out both}
.tag{font:500 14px 'Courier New',monospace;fill:#8b949e;animation:fade 3s ease-out both}
.cursor{font:600 19px 'Courier New',monospace;fill:#22D3EE;animation:blink 1s steps(1) infinite}
.ecg{fill:none;stroke:url(#ecg);stroke-width:2.5;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 4.5s ease-in-out infinite}
.grid{stroke:#ffffff;stroke-opacity:.04}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.35)}}
@keyframes fade{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes draw{0%{stroke-dashoffset:900}60%,100%{stroke-dashoffset:0}}
</style>
